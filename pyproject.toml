[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # hmmlearn internals, not our code; harmless on numpy>=2.5.
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:hmmlearn",
]
